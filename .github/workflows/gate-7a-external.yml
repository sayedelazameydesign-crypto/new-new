name: Gate 7A External Container Verification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full 40-character commit SHA to verify"
        required: true
        default: a3a5750b2e184481a34e64467db4f0514516ad33
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  IMAGE_NAME: celiaos-gate-7a:${{ github.sha }}
  HOST_PORT: "18080"
  CONTAINER_PORT: "3000"
  CONTAINER_NAME: celiaos-gate-7a
  EXPECTED_SHA_DEFAULT: a3a5750b2e184481a34e64467db4f0514516ad33

jobs:
  container-verification:
    name: Build and smoke-test production container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify immutable ref integrity
        shell: bash
        env:
          DISPATCH_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          expected_sha="${DISPATCH_EXPECTED_SHA:-$EXPECTED_SHA_DEFAULT}"
          actual_head_sha="${GITHUB_SHA:-}"
          workflow_sha="${GITHUB_WORKFLOW_SHA:-UNKNOWN}"
          repository="${GITHUB_REPOSITORY:-UNKNOWN}"
          ref="${GITHUB_REF:-UNKNOWN}"
          event="${GITHUB_EVENT_NAME:-UNKNOWN}"
          run_id="${GITHUB_RUN_ID:-UNKNOWN}"
          run_attempt="${GITHUB_RUN_ATTEMPT:-UNKNOWN}"

          printf '%s\n' \
            "REF_METADATA repository=$repository" \
            "REF_METADATA ref=$ref" \
            "REF_METADATA event=$event" \
            "REF_METADATA workflow_sha=$workflow_sha" \
            "REF_METADATA run_id=$run_id" \
            "REF_METADATA run_attempt=$run_attempt"

          if [[ ! "$expected_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'REF_INTEGRITY=FAIL REASON=INVALID_EXPECTED_SHA' >&2
            exit 1
          fi
          if [[ ! "$actual_head_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'REF_INTEGRITY=FAIL REASON=INVALID_ACTUAL_HEAD_SHA' >&2
            exit 1
          fi

          expected_sha="${expected_sha,,}"
          actual_head_sha="${actual_head_sha,,}"
          printf '%s\n' "REF_METADATA expected_sha=$expected_sha" "REF_METADATA actual_head_sha=$actual_head_sha"

          if [[ "$expected_sha" != "$actual_head_sha" ]]; then
            echo 'REF_INTEGRITY=FAIL REASON=SHA_MISMATCH' >&2
            exit 1
          fi
          echo 'REF_INTEGRITY=PASS'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify required files and absence of local secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f .dockerignore
          test -f pnpm-lock.yaml
          test -f package.json
          test ! -e .env
          test ! -e .env.local
          test ! -e .env.production
          assignment_pattern='(^|[^A-Za-z0-9_])(API[_-]?KEY|SECRET|TOKEN|PASSWORD|PASSWD|PRIVATE[_-]?KEY|ACCESS[_-]?KEY)[A-Za-z0-9_ -]*[=:][[:space:]]*["'"'"']?[A-Za-z0-9+/=_-]{20,}["'"'"']?([,;}]|$)'
          credential_value_pattern='-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|https?://[^/[:space:]@]+:[^/[:space:]@]+@|(AIza|sk-)[A-Za-z0-9_-]{20,}'
          scan_paths=(. ':(exclude).github/*' ':(exclude)todo.md' ':(exclude)*.md' ':(exclude)pnpm-lock.yaml' ':(exclude)template.json' ':(exclude)**/*.test.*' ':(exclude)**/*.spec.*')
          secret_found=0
          export TERM=dumb
          fixture_dir=$(mktemp -d)
          cleanup() {
            rm -rf "$fixture_dir"
          }
          trap cleanup EXIT
          emit_match_metadata() {
            local rule="$1"
            local record="$2"
            record=$(printf '%s' "$record" | sed $'s/\033\\[[0-9;]*m//g')
            EMIT_FILE="${record%%:*}"
            local remainder="${record#*:}"
            EMIT_LINE="${remainder%%:*}"
            EMIT_FILE="${EMIT_FILE//$'\r'/}"
            EMIT_LINE="${EMIT_LINE//$'\r'/}"
            EMIT_FILE="${EMIT_FILE//[[:space:]]/}"
            EMIT_LINE="${EMIT_LINE//[[:space:]]/}"
            local matched_text="${remainder#*:}"
            EMIT_SUBPATTERN='assignment_pattern'
            if [ "$rule" = 'credential_value_pattern' ]; then
              if grep -Eq -- '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' <<< "$matched_text"; then
                EMIT_SUBPATTERN='private_key_marker'
              elif grep -Eq -- 'https?://[^/[:space:]@]+:[^/[:space:]@]+@' <<< "$matched_text"; then
                EMIT_SUBPATTERN='url_userinfo'
              elif grep -Eq -- '(AIza|sk-)[A-Za-z0-9_-]{20,}' <<< "$matched_text"; then
                EMIT_SUBPATTERN='provider_token_prefix'
              else
                EMIT_SUBPATTERN='credential_value_pattern'
              fi
            fi
            local digest
            digest=$(printf '%s' "$matched_text" | sha256sum | awk '{print $1}')
            printf 'MATCH_FILE=%s MATCH_LINE=%s MATCH_RULE=%s MATCH_SUBPATTERN=%s MATCH_SHA256=%s\n' "$EMIT_FILE" "$EMIT_LINE" "$rule" "$EMIT_SUBPATTERN" "$digest"
          }

          set +e
          assignment_matches=$(git -c color.ui=false -c color.grep=false grep -nI -E "$assignment_pattern" -- "${scan_paths[@]}")
          assignment_status=$?
          set -e
          if [ "$assignment_status" -gt 1 ]; then
            echo "Secret assignment scan failed (git grep exit $assignment_status)." >&2
            exit "$assignment_status"
          fi
          if [[ -n "${assignment_matches//[[:space:]]/}" ]]; then
            while IFS= read -r match; do
              match=$(printf '%s' "$match" | sed $'s/\033\\[[0-9;]*[[:alpha:]]//g' | tr -d '\000-\010\013\014\016-\037\177')
              if [[ -z "${match//[[:space:]]/}" || "$match" != *:*:* ]]; then
                continue
              fi
              case "$match" in
                *'process.env'*|*'import.meta.env'*|*'${'*|*CHANGE_ME*|*REPLACE_ME*|*example*|*placeholder*|*dummy*|*mock*|*test*) continue ;;
              esac
              emit_match_metadata assignment_pattern "$match" >&2
              secret_found=1
            done <<< "$assignment_matches"
          fi

          set +e
          credential_matches=$(git -c color.ui=false -c color.grep=false grep -nI -E -e "$credential_value_pattern" -- "${scan_paths[@]}")
          credential_status=$?
          set -e
          if [ "$credential_status" -gt 1 ]; then
            echo "Credential value scan failed (git grep exit $credential_status)." >&2
            exit "$credential_status"
          fi
          if [[ -n "${credential_matches//[[:space:]]/}" ]]; then
            credential_match_found=0
            echo 'Credential-like match metadata (value redacted):' >&2
            while IFS= read -r match; do
              match=$(printf '%s' "$match" | sed $'s/\033\\[[0-9;]*[[:alpha:]]//g' | tr -d '\000-\010\013\014\016-\037\177')
              if [[ -z "${match//[[:space:]]/}" || "$match" != *:*:* ]]; then
                continue
              fi
              emit_match_metadata credential_value_pattern "$match" >&2
              credential_match_found=1
            done <<< "$credential_matches"
            if [ "$credential_match_found" -eq 1 ]; then
              secret_found=1
            fi
          fi

          echo '--- synthetic fixture diagnostic self-test ---'
          git -C "$fixture_dir" init -q
          git -C "$fixture_dir" config user.email gate-7a@example.invalid
          git -C "$fixture_dir" config user.name gate-7a-fixture
          mkdir -p "$fixture_dir/src"
          fixture_assignment_value="synthetic_diagnostic_value_$(printf '%s' '1234567890')"
          fixture_credential_value="$(printf '%s%s' 'AIza' 'SyntheticDiagnosticValue1234567890')"
          export FIXTURE_ASSIGNMENT_VALUE="$fixture_assignment_value" FIXTURE_CREDENTIAL_VALUE="$fixture_credential_value"
          printf 'TOKEN=%s\nVALUE=%s\n' "$fixture_assignment_value" "$fixture_credential_value" > "$fixture_dir/src/fixture.env"
          git -C "$fixture_dir" add src/fixture.env
          git -C "$fixture_dir" commit -qm fixture
          set +e
          fixture_assignment_matches=$(git -C "$fixture_dir" -c color.ui=false -c color.grep=false grep -nI -E "$assignment_pattern" -- .)
          fixture_assignment_status=$?
          fixture_credential_matches=$(git -C "$fixture_dir" -c color.ui=false -c color.grep=false grep -nI -E -e "$credential_value_pattern" -- .)
          fixture_credential_status=$?
          set -e
          test "$fixture_assignment_status" -le 1
          test "$fixture_credential_status" -le 1
          test -n "$fixture_assignment_matches"
          test -n "$fixture_credential_matches"
          fixture_assignment_match="${fixture_assignment_matches%%$'\n'*}"
          fixture_credential_match="${fixture_credential_matches%%$'\n'*}"
          emit_match_metadata assignment_pattern "$fixture_assignment_match" > /tmp/celiaos-gate7a-fixture-assignment-metadata
          emit_match_metadata credential_value_pattern "$fixture_credential_match" > /tmp/celiaos-gate7a-fixture-credential-metadata
          fixture_metadata=$(cat /tmp/celiaos-gate7a-fixture-assignment-metadata /tmp/celiaos-gate7a-fixture-credential-metadata)
          python3 - /tmp/celiaos-gate7a-fixture-assignment-metadata /tmp/celiaos-gate7a-fixture-credential-metadata <<'PY'
          import os
          import pathlib
          import sys

          expected = [
              (pathlib.Path(sys.argv[1]).read_text().strip(), 'src/fixture.env', '1', 'assignment_pattern', 'assignment_pattern'),
              (pathlib.Path(sys.argv[2]).read_text().strip(), 'src/fixture.env', '2', 'credential_value_pattern', 'provider_token_prefix'),
          ]
          for line, expected_file, expected_line, expected_rule, expected_subpattern in expected:
              fields = dict(item.split('=', 1) for item in line.split())
              actual_file = ''.join(char for char in fields['MATCH_FILE'] if char.isprintable())
              if not (actual_file == expected_file or actual_file.endswith('/' + expected_file)):
                  raise SystemExit('metadata FILE mismatch')
              if fields['MATCH_LINE'] != expected_line:
                  raise SystemExit('metadata LINE mismatch')
              if fields['MATCH_RULE'] != expected_rule:
                  raise SystemExit('metadata RULE mismatch')
              if fields['MATCH_SUBPATTERN'] != expected_subpattern:
                  raise SystemExit('metadata SUBPATTERN mismatch')
              if any(value in line for value in (os.environ['FIXTURE_ASSIGNMENT_VALUE'], os.environ['FIXTURE_CREDENTIAL_VALUE'])):
                  raise SystemExit('metadata redaction failure')
          PY
          if grep -Fq "$fixture_assignment_value" /tmp/celiaos-gate7a-fixture-assignment-metadata /tmp/celiaos-gate7a-fixture-credential-metadata || grep -Fq "$fixture_credential_value" /tmp/celiaos-gate7a-fixture-assignment-metadata /tmp/celiaos-gate7a-fixture-credential-metadata; then
            echo 'Synthetic secret value appeared in diagnostic output.' >&2
            exit 1
          fi
          rm -f /tmp/celiaos-gate7a-fixture-assignment-metadata /tmp/celiaos-gate7a-fixture-credential-metadata
          unset fixture_metadata
          fixture_secret_found=0
          [ -n "$fixture_assignment_matches" ] && fixture_secret_found=1
          [ -n "$fixture_credential_matches" ] && fixture_secret_found=1
          fixture_exit=0
          [ "$fixture_secret_found" -ne 0 ] && fixture_exit=1
          test "$fixture_exit" -eq 1
          echo 'SYNTHETIC_FIXTURE=PASS: file, line, rule, subpattern, redaction, and exit 1 verified.'

          echo "ASSIGNMENT_MATCH_BYTES=$(printf '%s' "$assignment_matches" | wc -c)"
          echo "CREDENTIAL_MATCH_BYTES=$(printf '%s' "$credential_matches" | wc -c)"
          echo "SECRET_FOUND_FLAG=$secret_found"
          if [ "$secret_found" -ne 0 ]; then
            exit 1
          fi
          echo 'SECRET_SCAN=PASS: no literal credential-like values found in source/config paths.'

      - name: Build image with Docker Buildx (test-before-push)
        shell: bash
        run: |
          set -euo pipefail
          started_ms=$(date +%s%3N)
          docker buildx build \
            --file Dockerfile \
            --tag "$IMAGE_NAME" \
            --load \
            .
          finished_ms=$(date +%s%3N)
          echo "IMAGE_BUILD_DURATION_MS=$((finished_ms - started_ms))"
          echo "IMAGE_SIZE_BYTES=$(docker image inspect "$IMAGE_NAME" --format '{{.Size}}')"
          echo 'This workflow stops after local image verification; no external publication step is configured.'

      - name: Run container and execute bounded smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          container_started=0
          cleanup() {
            set +e
            if [ "$container_started" -eq 1 ]; then
              echo '--- container logs before cleanup ---'
              docker logs "$CONTAINER_NAME" 2>&1 || true
              docker stop --time 10 "$CONTAINER_NAME" >/tmp/celiaos-gate7a-stop.log 2>&1 || true
              exit_code=$(docker inspect "$CONTAINER_NAME" --format '{{.State.ExitCode}}' 2>/dev/null || printf 'unavailable')
              echo "CONTAINER_EXIT_CODE=$exit_code"
              case "$exit_code" in
                0|143) echo "GRACEFUL_TERMINATION=PASS EXIT_CODE=$exit_code" ;;
                *)
                  echo 'Container did not terminate cleanly.' >&2
                  docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
                  exit 1
                  ;;
              esac
              docker rm "$CONTAINER_NAME" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          started_ms=$(date +%s%3N)
          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish "$HOST_PORT:$CONTAINER_PORT" \
            --env NODE_ENV=production \
            --env PORT="$CONTAINER_PORT" \
            "$IMAGE_NAME"
          container_started=1

          ready=0
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /tmp/celiaos-health.json --write-out '%{http_code}' "http://127.0.0.1:$HOST_PORT/api/health" || true)
            if [ "$status" = '200' ]; then
              ready=1
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -Fxq "$CONTAINER_NAME"; then
              echo 'Container exited before readiness.' >&2
              docker logs "$CONTAINER_NAME" 2>&1 || true
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Readiness timeout exceeded.' >&2
            exit 1
          fi
          finished_ms=$(date +%s%3N)
          echo "CONTAINER_STARTUP_MS=$((finished_ms - started_ms))"

          test "$(cat /tmp/celiaos-health.json)" = '{"ok":true}'

          curl --fail --silent --show-error "http://127.0.0.1:$HOST_PORT/" -o /tmp/celiaos-index.html
          grep -Eiq '<!doctype html|<html|id="root"' /tmp/celiaos-index.html
          echo 'STATIC=PASS'

          trpc_status=$(curl --silent --output /tmp/celiaos-auth-me.json --write-out '%{http_code}' "http://127.0.0.1:$HOST_PORT/api/trpc/auth.me")
          case "$trpc_status" in
            200|401|403) echo "TRPC_AUTH_ME=PASS HTTP_STATUS=$trpc_status" ;;
            *) echo "Unexpected tRPC auth.me status: $trpc_status" >&2; cat /tmp/celiaos-auth-me.json; exit 1 ;;
          esac

          oauth_status=$(curl --silent --output /tmp/celiaos-oauth.json --write-out '%{http_code}' "http://127.0.0.1:$HOST_PORT/api/oauth/callback")
          test "$oauth_status" = '400'
          echo 'AUTH_OAUTH_ROUTE=PASS HTTP_STATUS=400 for missing code/state without secrets'

          echo '--- authenticated SSE mock integration inside built image ---'
          docker exec \
            --env NODE_ENV=test \
            "$CONTAINER_NAME" \
            corepack pnpm exec vitest run server/sse.http.test.ts --reporter=dot
          echo 'AUTHENTICATED_SSE_MOCK=PASS'

          echo '--- resource observation ---'
          docker stats --no-stream --format 'CPU={{.CPUPerc}} MEM={{.MemUsage}}' "$CONTAINER_NAME"

          echo '--- running container logs ---'
          docker logs "$CONTAINER_NAME" 2>&1 | tee /tmp/celiaos-gate7a.log
          if grep -Eiq 'uncaught exception|unhandled rejection|EADDRINUSE|fatal crash' /tmp/celiaos-gate7a.log; then
            echo 'Crash signature found in container logs.' >&2
            exit 1
          fi

          echo 'SECURITY=PASS: no workflow secrets or external publication step is defined.'
          echo 'CONTAINER_SMOKE=PASS'
